services:
  - type: web
    name: figuritas
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: figuritas-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: figuritas-db
    plan: free
